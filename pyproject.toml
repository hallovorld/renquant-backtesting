[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renquant-backtesting"
version = "0.1.0"
description = "Backtesting and LEAN assembly workflows for RenQuant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "renquant-common>=0.10,<1.0",  # market_calendar (campaign B5)
  "renquant-pipeline>=0.4,<0.5",
  # the PUBLIC fold-scoring contract (model#183) consumed by the lineage lane;
  # 0.2.0 is the version that ships renquant_model_gbdt.fold_scoring
  "renquant-model[gbdt]>=0.2.0,<0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "../renquant-common/src",
  "../renquant-base-data/src",
  "../renquant-artifacts/src",
  "../renquant-pipeline/src",
  "../renquant-model/src",
]
testpaths = ["tests"]
